<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Todo List</title>
  </head>
  <body>
    <h2>Todo List</h2>
    <form action="todoList.html" th:action="@{/addTodo}" method="post">
      タスクを追加：<br />
      <label for="title">名前</label
      ><input type="text" name="title" id="title" /><br />
      <label for="description">説明</label
      ><input type="text" name="description" id="description" /><br />
      <button type="submit">登録</button>
    </form>
    <form action="todoList.html" method="post">
      <table>
        <tr th:each="todo : ${todoList}">
          <td th:text="${todo.title}" class="title">title</td>
          <td th:text="${todo.description}" class="description">description</td>
          <td>
            <input type="checkbox" name="done" class="done" />
          </td>
          <td>
            <button type="button">削除</button>
          </td>
        </tr>
      </table>
    </form>
  </body>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script th:src="@{/js/check.js}"></script>
</html>
